server:
  address: 127.0.0.1
  port: 8082
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/cem_workspace?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:123456}"
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
cem:
  admin-password: "${CEM_ADMIN_PASSWORD:admin123}"
  demo-data: "${CEM_DEMO_DATA:true}"
